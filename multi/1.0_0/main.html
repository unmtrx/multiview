<!DOCTYPE html>
<html>
<head>
    <title>Multi-View</title>
    <style>
        :root {
            --primary-color: #35d7ff;
            --primary-hover: #7be8ff;
            --danger-color: #ff5d73;
            --surface-color: #0b1320;
            --surface-elevated: #101b2d;
            --background-color: #050a14;
            --border-color: rgba(112, 214, 255, 0.18);
            --text-primary: #f4f8ff;
            --text-secondary: #91a7bf;
            --border-radius: 8px;
            --box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35),
                          0 0 0 1px rgba(112, 214, 255, 0.05);
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background:
                radial-gradient(circle at 15% -10%, rgba(53, 215, 255, 0.16), transparent 34%),
                radial-gradient(circle at 90% 5%, rgba(124, 92, 255, 0.12), transparent 30%),
                linear-gradient(180deg, #07101d 0%, var(--background-color) 100%);
            color: var(--text-primary);
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        #container {
            display: grid;
            height: 100vh;
            width: 100vw;
            gap: 0;
            background: transparent;
        }

        #container.grid-2 {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr;
        }

        #container.grid-3 {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }

        #container.grid-3 > .iframe-container:first-child {
            grid-column: span 2;
        }

        #container.grid-4 {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }

        iframe {
            width: 100%;
            height: 100%;
            background-color: #050a14;
            z-index: 2;
            position: relative;
            border: none;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        iframe::-webkit-scrollbar {
            display: none;
        }

        .iframe-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(16, 27, 45, 0.96), rgba(9, 17, 30, 0.98));
        }

        .urlInputForm {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: min(720px, calc(100vw - 48px));
            padding: 24px;
            background: linear-gradient(180deg, rgba(16, 27, 45, 0.96), rgba(9, 17, 30, 0.98));
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            box-shadow: var(--box-shadow);
            z-index: 1000;
            box-sizing: border-box;
        }

        .urlInput {
            width: 100%;
            margin-bottom: 14px;
            padding: 12px 14px;
            box-sizing: border-box;
            font-size: 18px;
            background-color: rgba(5, 10, 20, 0.72);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            color: var(--text-primary);
            outline: none;
        }

        .urlInput::placeholder {
            color: rgba(145, 167, 191, 0.72);
        }

        .urlInput:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(53, 215, 255, 0.14),
                        0 0 26px rgba(53, 215, 255, 0.12);
        }

        button {
            font: inherit;
        }

        .urlInputForm button,
        .iframe-url-button,
        .url-set-button {
            border-radius: var(--border-radius);
            cursor: pointer;
            font-weight: 700;
            letter-spacing: 0;
        }

        .urlInputForm button {
            float: right;
            margin-left: 10px;
            padding: 8px 14px;
            border: 1px solid var(--border-color);
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .urlInputForm button:hover {
            border-color: rgba(123, 232, 255, 0.44);
            background-color: rgba(53, 215, 255, 0.1);
        }

        #setUrlButton {
            background: linear-gradient(135deg, var(--primary-color), #1788ff);
            border: none;
            color: #03111f;
            box-shadow: 0 10px 24px rgba(53, 215, 255, 0.22);
        }

        #setUrlButton:hover {
            background: linear-gradient(135deg, var(--primary-hover), #35d7ff);
        }

        #clearSetUrlButton:hover {
            border-color: rgba(255, 93, 115, 0.5);
            background-color: rgba(255, 93, 115, 0.12);
        }

        .url-set-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 20px;
            font-size: 16px;
            z-index: 1;
        }

        .iframe-url-button {
            position: absolute;
            top: 10px;
            left: 10px;
            display: none;
            padding: 7px 10px;
            font-size: 12px;
            background: rgba(5, 10, 20, 0.76);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            z-index: 10;
            opacity: 0.24;
            backdrop-filter: blur(12px);
        }

        .iframe-container:hover .iframe-url-button {
            display: block;
        }

        .iframe-url-button:hover {
            opacity: 0.52;
            border-color: var(--primary-color);
            box-shadow: 0 0 18px rgba(53, 215, 255, 0.24);
        }

        .iframe-container .iframe-url-button {
            display: none;
        }

        .iframe-container iframe:not([src]),
        .iframe-container iframe[src=""] {
            display: none;
        }

        .iframe-container iframe:not([src]) + .iframe-url-button,
        .iframe-container iframe[src=""] + .iframe-url-button {
            display: block !important;
            padding: 12px 18px;
            font-size: 16px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, var(--primary-color), #1788ff);
            border: none;
            color: #03111f;
            box-shadow: 0 10px 24px rgba(53, 215, 255, 0.22);
        }
    </style>
</head>
<body>
<div id="container"></div>

<div id="urlInputForm" class="urlInputForm" style="display:none;">
    <input type="text" id="urlInput" class="urlInput" placeholder="Enter URL">
    <button id="setUrlButton">Set URL</button>
    <button id="clearSetUrlButton">Clear</button>
    <button id="cancelSetUrlButton">Cancel</button>
</div>


<script src="main.js"></script>
</body>
</html>
