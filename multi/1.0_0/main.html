<!DOCTYPE html>
<html>
<head>
    <title>Multi-View</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden; /* ADD THIS: Prevents the main window from ever scrolling */
            background-color: #000;
        }

        /* Base Grid Settings */
        #container {
            display: grid;
            height: 100vh;
            width: 100vw;
            gap: 1px;
        }

        /* 2 Frames: 2 columns, 1 row */
        #container.grid-2 {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr;
        }

        /* 3 Frames: 2 columns, 2 rows + T-shape logic */
        #container.grid-3 {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }
        /* This makes the first iframe span both columns */
        #container.grid-3 > .iframe-container:first-child {
            grid-column: span 2;
        }

        /* 4 Frames: 2 columns, 2 rows */
        #container.grid-4 {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
        }

        /* 1. Target the iframe and hide bars for Firefox/IE */
        iframe {
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 2;
            position: relative;
            border: none; /* Removes the thin default border */

            /* Hides scrollbar for Firefox */
            scrollbar-width: none; 
            /* Hides scrollbar for IE/Edge */
            -ms-overflow-style: none; 
        }

        /* 2. Target Chrome, Edge, and Safari specifically to hide the 'button' */
        iframe::-webkit-scrollbar {
            display: none;
        }

        /* 3. Ensure the container doesn't show its own scrollbars */
        .iframe-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents the 'double scrollbar' effect */
        }

        /* Styles for URL input form */
        .urlInputForm {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #4f0000b9;
            border: 1px solid #00000000;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            padding: 3vW;
            border-radius: 11px;
        }
        .urlInputForm button {
            font-size: 20px;
            float: right;
            margin-left: 10px;
            border: none;
            padding: 5px 14px;
            border-radius: 4px;
            cursor: pointer;
            opacity: 0.8;
            background: #ffffff;
        }
        .urlInputForm button:hover {
            opacity: 1;
        }

        /* Styles for input field and button */
        .urlInput {
            min-width: 50vW;
            margin-bottom: 10px;
            padding: 10px;
            font-size: 20px;
            background-color: #ffffff !important;
            border: none;
            outline: none;
        }


        .url-set-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            z-index: 1;
        }

        .iframe-url-button {
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            padding: 5px;
            font-size: 12px;
            background-color: rgba(249, 249, 249, 0.7);
            border: 1px solid #ffffff;
            cursor: pointer;
            z-index: 10;
            font-weight: bold;
            opacity: .6;
        }

        /* Show the button when hovering over the iframe container */
        .iframe-container:hover .iframe-url-button {
            display: block;
        }
        .iframe-url-button:hover{
            opacity: 1;
        }

        #container.grid-3 > .iframe-container:first-child {
          grid-column: span 2;
        }
        
        .iframe-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* Style for the button when iframe is not displayed */
        .iframe-container .iframe-url-button {
            display: none; /* Initially hide the button */
        }

        /* Show the button only when the iframe is not displayed */
        .iframe-container iframe:not([src]),
        .iframe-container iframe[src=""] {
            display: none; /* Hide the iframe if it has no src */
        }

        .iframe-container iframe:not([src]) + .iframe-url-button,
        .iframe-container iframe[src=""] + .iframe-url-button {
            display: block !important; /* Show the button */
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            z-index: 10;
            left: calc(50% - 56px);
            top: calc(50% - 20px);
        }

        #setUrlButton {
            color: rgb(59, 0, 0);
            background: #ffffff;

        }

    </style>
</head>
<body>
<div id="container"></div>

<div id="urlInputForm" class="urlInputForm" style="display:none;">
    <input type="text" id="urlInput" class="urlInput" placeholder="Enter URL">
    <button id="setUrlButton">Set URL</button>
    <button id="clearSetUrlButton">Clear</button>
    <button id="cancelSetUrlButton">Cancel</button>
</div>


<script src="main.js"></script>
</body>
</html>
